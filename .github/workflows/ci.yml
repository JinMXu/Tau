name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + lint + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lockfiles are pinned to registry.npmjs.org (.npmrc); audit against the
      # same registry or npm answers NOT_IMPLEMENTED.
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (fmt + clippy + cargo test)
    # Windows avoids the webkit2gtk system packages tauri needs on Linux;
    # the lib tests are hermetic (temp dirs only, no pi binary required).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # RustSec advisory database, so a vulnerable transitive crate surfaces on
      # a PR instead of at the next release audit. The ignored entries all
      # trace to tauri 2.x and have no fix short of the tauri 3 line:
      #   RUSTSEC-2024-0429  glib unsoundness — Linux gtk stack only (gtk →
      #                      muda → tauri); never compiled into the Windows or
      #                      macOS binaries this project ships
      #   RUSTSEC-2024-0370  proc-macro-error unmaintained — pulled by
      #                      glib-macros, same Linux-only chain
      #   RUSTSEC-2025-0075..0100  the unic-* family is unmaintained —
      #                      urlpattern → tauri-utils → tauri, informational
      # Drop each ignore when the tauri upgrade lands; a NEW advisory in any
      # of these crates (or anywhere else) still fails this step.
      - uses: taiki-e/install-action@cargo-audit
      - run: >
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080
          --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0098
          --ignore RUSTSEC-2025-0100

  backend-macos:
    name: Backend (macOS compile)
    # The release workflow used to be the only place that ever compiled for
    # macOS, so a macOS-only compile error — e.g. a `#[cfg(windows)]` item
    # imported unconditionally — stayed green here and only surfaced after
    # tagging (v0.1.5 shipped Windows-only because of exactly that). A
    # `cargo check` of the lib exercises the cfg(unix) / cfg(target_os =
    # "macos") code paths without paying for a full bundle.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml --lib

  protocol:
    name: Protocol (session-host RPC suite)
    # The suite spawns the vendored runtime, so vendor:pi must run first —
    # without it every test skips, which is exactly how the sidecar e2e tests
    # came to never execute in CI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run vendor:pi
      - run: npm run test:protocol
