[package]
name = "tau"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Move the native traffic lights vertically: wry's trafficLightPosition.y
# is a no-op for vertical placement, so reposition the standard window
# buttons directly.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Observe NSWindowDid(Enter|Exit)FullScreenNotification (posted when the
# fullscreen transition animation finishes) to sync the header buttons with
# the transition.
block2 = "0.6"
